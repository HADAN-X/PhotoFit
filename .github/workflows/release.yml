name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build standalone app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "证件照压缩工具" --collect-all PIL src/compressed_gui.py
      - name: Package release
        run: Compress-Archive -Path "dist/证件照压缩工具.exe", README.md -DestinationPath "dist/证件照压缩工具-Windows-x64.zip"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/证件照压缩工具-Windows-x64.zip
